{# URL: http://server.test/habits/habit/2/options #}
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Habit Options</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='habit_options.js') }}"></script>
</head>

<body>
    <h1>Options for <span id="habit-name"></span></h1>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Back to Main Page</a>
        <a href="{{ url_for('habit_page', habit_id=habit_id) }}">Back to Habit Page</a>
    </div>

    <div class="options-container">
        <div class="option-item">
            <label>
                <input type="checkbox" id="fail-by-default"> Fail by default (An empty cell is considered a failure)
            </label>
        </div>

        <div class="option-item">
            <label>
                <input type="checkbox" id="single-checkbox"> Single checkbox mode (Only one "done" status available)
            </label>
        </div>

        <div class="option-item">
            <label>
                <input type="checkbox" id="multi-numbers"> Numbers only mode (Only numeric statuses 0-9 available)
            </label>
        </div>

        <div class="option-item">
            <label>
                <input type="checkbox" id="bad-habit"> Bad habit mode
            </label>
        </div>

        <div class="option-item">
            Habit levels:
            <label>
                <select id="levels">
                    <option value="1">1</option>
                    <option value="3">3</option>
                    <option value="10">10</option>
                </select>
            </label>
        </div>

        <div class="option-item">
            <h3>Rename Habit</h3>
            <input type="text" id="new-habit-name" placeholder="New name">
            <button onclick="renameHabit()" class="option-button">Rename</button>
            <div id="rename-status" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        // Pass habit ID to JavaScript
        const habitId = parseInt("{{ habit_id }}");
    </script>
</body>

</html>
