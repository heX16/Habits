<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 64 64" width="64px" height="64px">
  <!-- Top squares (shifted 2px right) -->
  <rect x="8"  y="4" width="8" height="8" stroke="black" stroke-width="1" fill="rgb(50, 205, 50)"/>
  <rect x="18" y="4" width="8" height="8" stroke="black" stroke-width="1" fill="rgb(56, 229, 56)"/>
  <rect x="28" y="4" width="8" height="8" stroke="black" stroke-width="1" fill="rgb(184, 45, 45)"/>
  <rect x="38" y="4" width="8" height="8" stroke="black" stroke-width="1" fill="rgb(62, 255, 62)"/>
  <rect x="48" y="4" width="8" height="8" stroke="black" stroke-width="1" fill="rgb(50, 205, 50)"/>

  <!-- Main square -->
  <rect x="8" y="16" width="48" height="48" stroke="black" stroke-width="3" fill="rgb(50, 205, 50)"/>

  <!-- Checkmark outline (shifted 2px left) -->
