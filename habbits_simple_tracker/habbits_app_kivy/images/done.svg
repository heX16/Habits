<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Square -->
  <rect x="10" y="10" width="80" height="80" fill="limegreen" stroke="black" stroke-width="5"/>
  
  <!-- Checkmark Outline (Black Border for Smoothness) -->
  <polyline points="25,50 45,70 75,30" fill="none" stroke="black" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark (White Main Stroke) -->
  <polyline points="25,50 45,70 75,30" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
