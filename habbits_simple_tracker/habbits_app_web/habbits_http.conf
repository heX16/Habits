
# Map the URL path /sysmon to the CGI script
ScriptAlias /habbits_hex "/srv/programs/habbits_hex/flask_cgi_backend.exec.py"

# Provide permissions and enable CGI execution for the CGI script directory
<Directory /srv/programs/habbits_hex>
  Options +FollowSymlinks +ExecCGI
  AllowOverride All
  AddHandler cgi-script .py
  Require all granted
  DirectoryIndex flask_cgi_backend.exec.py
</Directory>

# Logging configuration for errors for the /habbits alias
ErrorLog ${APACHE_LOG_DIR}/habbits.log
# ErrorLog ${APACHE_LOG_DIR}/habbits-error.log

CustomLog ${APACHE_LOG_DIR}/access.log combined

