<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        @keyframes firework {
            0% {
                transform: translate(0, 0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--final-x), var(--final-y)) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        .firework {
            position: fixed;
            font-size: 20px;
            animation: firework 1s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            pointer-events: none;
            z-index: 1000;
        }

        .firework::before {
            content: attr(data-emoji);
        }
    </style>
</head>
<body>
    <h1>Habit Tracker</h1>
    <div>
        <a href="/edit">Edit Habits</a> |
        <a href="/backup">Backup/Restore</a>
    </div>
    <table id="habits-table" border="1">
        <!-- Table content will be dynamically generated -->
    </table>
    <script src="/js/constants.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
