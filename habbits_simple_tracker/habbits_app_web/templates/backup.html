{# URL: http://server.test/habits/backup #}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Backup/Restore Habits</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        #status {
            margin: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <h1>Backup/Restore Habits</h1>
    <div class="nav-link-container">
        <a href="{{ url_for('index') }}">Back to Main Page</a>
    </div>
    <div>
        <button onclick="exportHabits()">Export to habits.csv</button>
        <input type="file" id="importFile" accept=".csv" style="display: none;" onchange="importHabits(this.files)">
        <button onclick="document.getElementById('importFile').click()">Import from habits.csv</button>
    </div>
    <div id="status"></div>

    <script>
        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = isError ? 'error' : 'success';
        }

        function exportHabits() {
            fetch('{{ url_for("api_export") }}')
                .then(response => response.text())
                .then(csv => {
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'habits.csv';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showStatus('Export completed successfully');
                })
                .catch(error => {
                    showStatus('Error during export: ' + error, true);
                });
        }

        function importHabits(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const csvData = e.target.result;
                if (!csvData) {
                    showStatus('Error: File is empty', true);
                    return;
                }
                
                fetch('{{ url_for("api_import") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: csvData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showStatus('Error: ' + data.error, true);
                    } else {
                        showStatus(data.message);
                    }
                })
                .catch(error => {
                    showStatus('Error during import: ' + error, true);
                });
            };
            
            reader.onerror = function() {
                showStatus('Error reading file', true);
            };
            
            reader.readAsText(file);
        }
    </script>
</body>
</html>
