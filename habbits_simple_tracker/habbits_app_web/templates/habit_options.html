{# URL: http://server.test/habits/habit/2/options #}
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Habit Options</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Options for <span id="habit-name"></span></h1>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Back to Main Page</a>
        <a href="{{ url_for('habit_page', habit_id=habit_id) }}">Back to Habit Page</a>
    </div>

    <div class="options-container">
        <div class="option-item">
            <label>
                <input type="checkbox" id="fail-by-default"> Fail by default (An empty cell is considered a failure)
            </label>
        </div>

        <div class="option-item">
            <label>
                <input type="checkbox" id="single-checkbox"> Single checkbox mode (Only one "done" status available)
            </label>
        </div>

        <div class="option-item">
            <h3>Rename Habit</h3>
            <input type="text" id="new-habit-name" placeholder="New name">
            <button onclick="renameHabit()" class="option-button">Rename</button>
            <div id="rename-status" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        const habitId = parseInt("{{ habit_id }}");

        document.addEventListener('DOMContentLoaded', function () {
            // Load habit name
            fetch(`../../api/habits/list`)
                .then(response => response.json())
                .then(data => {
                    const habit = data.habits.find(h => h.id === habitId);
                    if (habit) {
                        document.getElementById('habit-name').textContent = habit.name;
                    }
                });

            // Load fail_by_default parameter
            fetch(`../../api/param/fail_by_default/${habitId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('fail-by-default').checked = data.value === '1';
                });

            // Load single_checkbox parameter
            fetch(`../../api/param/single_checkbox/${habitId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('single-checkbox').checked = data.value === '1';
                });

            // Handle checkbox change
            document.getElementById('fail-by-default').addEventListener('change', function (e) {
                const value = e.target.checked ? '1' : '0';
                fetch(`../../api/param/fail_by_default/${habitId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        value: value
                    })
                });
            });

            // Handle single checkbox change
            document.getElementById('single-checkbox').addEventListener('change', function (e) {
                const value = e.target.checked ? '1' : '0';
                fetch(`../../api/param/single_checkbox/${habitId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        value: value
                    })
                });
            });
        });

        function renameHabit() {
            const newName = document.getElementById('new-habit-name').value.trim();
            if (!newName) {
                showRenameStatus('Name cannot be empty', 'error');
                return;
            }

            fetch(`../../api/habits/rename`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    habit_id: parseInt(habitId),
                    new_name: newName
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showRenameStatus(data.error, 'error');
                    } else {
                        showRenameStatus('Habit renamed successfully', 'success');
                        document.getElementById('habit-name').textContent = newName;
                        document.getElementById('new-habit-name').value = '';
                    }
                })
                .catch(error => {
                    showRenameStatus('Error occurred while renaming', 'error');
                });
        }

        function showRenameStatus(message, type) {
            const statusDiv = document.getElementById('rename-status');
            statusDiv.textContent = message;
            statusDiv.className = type === 'error' ? 'habit-options-error' : 'habit-options-success';
        }
    </script>
</body>

</html>
