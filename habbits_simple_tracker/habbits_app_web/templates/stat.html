<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Habit Statistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .calendars-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        
        .calendar-table {
            border-collapse: collapse;
            min-width: 300px;
        }
        
        .calendar-table caption {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 0.5rem;
        }
        
        .calendar-table th,
        .calendar-table td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: center;
            width: 2.5rem;
            height: 2.5rem;
        }
        
        .calendar-table td.empty {
            background-color: #f5f5f5;
        }
        
        .back-link {
            margin: 1rem;
        }
        
        #habit-name {
            text-align: center;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="{{ url_for('index') }}">Back to Tracker</a>
    </div>
    <h1>Statistics</h1>
    <h2 id="habit-name"></h2>
    <div id="stat-container">
        <!-- Calendars will be rendered here -->
    </div>
    <script>
        const habitId = "{{ habit_id }}";
    </script>
    <script src="{{ url_for('js_constants') }}"></script>
    <script src="{{ url_for('static', filename='stat.js') }}"></script>
</body>
</html>
