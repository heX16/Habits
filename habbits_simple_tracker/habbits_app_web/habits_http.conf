
# Map the URL path /sysmon to the CGI script
ScriptAlias /habits_hex "/srv/programs/habits_hex/flask_cgi_backend.exec.py"

# Provide permissions and enable CGI execution for the CGI script directory
<Directory /srv/programs/habits_hex>
  Options +FollowSymlinks +ExecCGI
  AllowOverride All
  AddHandler cgi-script .py
  Require all granted
  DirectoryIndex flask_cgi_backend.exec.py
</Directory>

# Logging configuration for errors for the /habits alias
ErrorLog ${APACHE_LOG_DIR}/habits.log
# ErrorLog ${APACHE_LOG_DIR}/habits-error.log

CustomLog ${APACHE_LOG_DIR}/access.log combined

